<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Privacy Policy – Adhkaree</title>
  <meta name="description" content="Privacy policy of Adhkaree, your daily dhikr companion.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FBF6EE; --card: #FFFFFF; --text: #3A2B3C; --muted: #6E5E70;
      --accent: #4F3951; --soft: #E7E1F9; --line: #EDE6F2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #241A26; --card: #33263A; --text: #F1EAF4; --muted: #C9BCCD;
        --accent: #E7E1F9; --soft: #4F3951; --line: #45354B;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: 'Inter', Arial, sans-serif; line-height: 1.7;
    }
    .blob { position: fixed; border-radius: 50%; background: var(--soft); z-index: -1; }
    .blob.a { width: 340px; height: 340px; top: -150px; left: -130px; }
    .blob.b { width: 300px; height: 300px; bottom: -140px; right: -120px; }
    main { max-width: 760px; margin: 0 auto; padding: 48px 20px 64px; }
    header { text-align: center; margin-bottom: 28px; }
    .logo {
      font-family: 'Playfair Display', Georgia, serif; font-size: 44px;
      color: var(--accent); margin: 0; letter-spacing: 0.5px;
    }
    .tagline { color: var(--muted); margin: 4px 0 0; }
    /* Choix de la langue (sans JavaScript) */
    .lang-input { position: absolute; opacity: 0; pointer-events: none; }
    .lang-switch { display: flex; justify-content: center; gap: 8px; margin: 20px 0 28px; }
    .lang-switch label {
      cursor: pointer; padding: 6px 16px; border-radius: 999px;
      border: 1px solid var(--line); color: var(--muted); font-weight: 600; font-size: 14px;
    }
    #en:checked ~ .lang-switch label[for="en"],
    #fr:checked ~ .lang-switch label[for="fr"],
    #ar:checked ~ .lang-switch label[for="ar"] {
      background: var(--accent); color: var(--bg); border-color: var(--accent);
    }
    .content { display: none; }
    #en:checked ~ .en, #fr:checked ~ .fr, #ar:checked ~ .ar { display: block; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 18px;
      padding: 28px 28px 8px; box-shadow: 0 6px 24px rgba(79, 57, 81, 0.07);
    }
    h1 { font-family: 'Playfair Display', Georgia, serif; color: var(--accent); font-size: 28px; margin: 0 0 4px; }
    .updated { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
    .highlight {
      background: var(--soft); border-radius: 12px; padding: 14px 18px; margin: 0 0 24px; font-weight: 600;
    }
    h2 { font-size: 18px; color: var(--accent); margin: 26px 0 6px; }
    ul { padding-left: 20px; margin: 6px 0; }
    li { margin: 4px 0; }
    a { color: var(--accent); font-weight: 600; }
    .ar { direction: rtl; text-align: right; }
    .ar ul { padding-left: 0; padding-right: 20px; }
    footer { text-align: center; color: var(--muted); font-size: 14px; margin-top: 36px; }
  </style>
